name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # repo.andrei1058.com no longer serves public sidebar jars (404),
      # so we build SidebarLib into the local Maven cache.
      - name: Install SidebarLib dependencies
        run: |
          set -euo pipefail
          ver="24.2"
          dir="/tmp/SidebarLib-$ver"
          echo "::group::Installing SidebarLib $ver"
          rm -rf "$dir"
          git clone --depth 1 --branch "$ver" https://github.com/andrei1058/SidebarLib.git "$dir"
          cd "$dir"
          # PlaceholderAPI repo moved; 2.11.3 is gone from the new host.
          find . -name 'pom.xml' -print0 | xargs -0 sed -i \
            -e 's|https://repo.extendedclip.com/content/repositories/placeholderapi/|https://repo.extendedclip.com/releases/|g' \
            -e 's|>2\.11\.3<|>2.11.6<|g'
          mvn -B versions:set -DnewVersion="$ver" -DgenerateBackupPoms=false
          mvn -B versions:update-child-modules -DgenerateBackupPoms=false
          mvn -B clean install -DskipTests
          echo "::endgroup::"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-plugin
          path: bedwars-plugin/target/*.jar
          if-no-files-found: warn
